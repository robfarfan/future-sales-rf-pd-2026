[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "future_sales"
version = "0.0.1"
description = "Forecasting de ventas mensuales por tienda-producto (Predict Future Sales, 1C Company)."
authors = [
  { name = "rf" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.11"


[tool.ruff]
line-length = 79
src = ["future_sales"]
include = ["pyproject.toml", "future_sales/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["future_sales"]
force-sort-within-sections = true


[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
